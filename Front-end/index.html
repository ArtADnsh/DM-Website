<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discrete Mathematics course website — Iran University of Science and Technology"
    />
    <meta name="theme-color" content="#eef1f7" />

    <!-- Open Graph / Twitter link previews (add og:image with an absolute URL once the domain is final) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Discrete Mathematics · IUST" />
    <meta property="og:title" content="Discrete Mathematics · IUST" />
    <meta
      property="og:description"
      content="Lecture notes, assignments, quizzes, recitation classes and the teaching team for Discrete Mathematics at Iran University of Science and Technology."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Discrete Mathematics · IUST" />
    <meta
      name="twitter:description"
      content="Course portal for Discrete Mathematics — Iran University of Science and Technology."
    />

    <title>Discrete Mathematics · IUST</title>
    <script>
      // Apply the saved theme before first paint to avoid a light-mode flash.
      (function () {
        try {
          var saved;
          try { saved = localStorage.getItem('dm-theme'); } catch (e) {}
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          // Keep the mobile browser bar in sync (must match --background in index.css).
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#151923' : '#eef1f7');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
