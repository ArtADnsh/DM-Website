name: dm-website

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dm-website-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
