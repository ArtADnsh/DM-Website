name: dm-website

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dm-website-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./Back-end
      dockerfile: Dockerfile
    container_name: dm-website-backend
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - db_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  media_data:
  db_data:
